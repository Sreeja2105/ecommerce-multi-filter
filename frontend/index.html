<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSphere – Product Catalog</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>ShopSphere</h1>
    <span class="tagline">Marketplace catalog</span>
  </header>

  <div class="layout">
    <!-- Sticky filter sidebar -->
    <aside class="sidebar" aria-label="Filters">
      <div class="sidebar-head">
        <h2>Filters</h2>
        <button id="clear-btn" class="link-btn" type="button">Clear all</button>
      </div>

      <section class="filter-group">
        <h3>Category</h3>
        <div id="category-list" class="checklist"></div>
      </section>

      <section class="filter-group">
        <h3>Price Range</h3>
        <div class="price-values">
          <span>₹<span id="price-min-label">0</span></span>
          <span>₹<span id="price-max-label">0</span></span>
        </div>
        <div class="range-slider">
          <div class="range-track"></div>
          <div id="range-fill" class="range-fill"></div>
          <input id="price-min" type="range" aria-label="Minimum price" />
          <input id="price-max" type="range" aria-label="Maximum price" />
        </div>
      </section>

      <section class="filter-group">
        <h3>Minimum Rating</h3>
        <div id="rating-list" class="radiolist"></div>
      </section>
    </aside>

    <!-- Product grid -->
    <main class="content">
      <div class="toolbar">
        <p id="result-count" class="result-count">Loading…</p>
        <label class="sort">
          Sort by
          <select id="sort-select"></select>
        </label>
      </div>

      <div id="product-grid" class="grid" aria-live="polite"></div>

      <div id="empty-state" class="empty-state hidden">
        <p>No items match your criteria.</p>
        <button id="reset-btn" class="primary-btn" type="button">Reset filters</button>
      </div>

      <div id="error-state" class="empty-state hidden">
        <p id="error-msg">Something went wrong.</p>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
